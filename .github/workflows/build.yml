name: Build DizzyoOS ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --user root --privileged

    steps:
    - name: Setup Arch environment
      run: |
        pacman-key --init
        pacman-key --populate
        pacman -Syu --noconfirm
        pacman -S --noconfirm archiso base-devel grub efibootmgr dosfstools mtools xorriso syslinux

    - name: Checkout
      uses: actions/checkout@v4
      with:
        path: dizzyo-os

    - name: Build full rootfs with pacstrap
      run: |
        set -e
        ROOTFS=/tmp/rootfs
        mkdir -p $ROOTFS
        pacstrap -K $ROOTFS base linux linux-firmware \
          plasma-desktop sddm konsole dolphin kdialog \
          networkmanager wireless_tools wpa_supplicant \
          grub efibootmgr dosfstools mtools \
          xorg-xwayland xorg-server \
          firefox zenity rsync \
          sudo bash-completion
        systemctl --root=$ROOTFS enable sddm NetworkManager
        echo "Rootfs packages installed"

    - name: Configure rootfs
      run: |
        set -e
        ROOTFS=/tmp/rootfs

        echo "dizzyo-live" > $ROOTFS/etc/hostname
        printf "127.0.0.1 localhost\n::1 localhost\n127.0.1.1 dizzyo-live dizzyo-live.localdomain\n" > $ROOTFS/etc/hosts
        printf 'NAME="DizzyoOS"\nVERSION="1.0.0"\nID=dizzyo\nID_LIKE=arch\nPRETTY_NAME="DizzyoOS 1.0.0 (Genesis)"\nHOME_URL="https://dizzyo-os.org"\nBUG_REPORT_URL="https://github.com/dizzyOS/dizzyo-os/issues"\n' > $ROOTFS/etc/os-release
        echo "dizzyo ALL=(ALL) NOPASSWD:ALL" > $ROOTFS/etc/sudoers.d/dizzyo
        chmod 440 $ROOTFS/etc/sudoers.d/dizzyo

        mkdir -p $ROOTFS/etc/systemd/logind.conf.d
        printf '[Logind]\nHandleLidSwitch=ignore\nHandleLidSwitchExternalPower=ignore\n' > $ROOTFS/etc/systemd/logind.conf.d/no-lid.conf

        mkdir -p $ROOTFS/etc/sddm.conf.d
        sudo bash -c "printf '[General]\nDisplayServer=wayland\nHaltCommand=/usr/bin/systemctl poweroff\nRebootCommand=/usr/bin/systemctl reboot\n\n[Autologin]\nUser=dizzyo\nSession=plasma.desktop\n' > $ROOTFS/etc/sddm.conf.d/dizzyo.conf"

        mkdir -p $ROOTFS/etc/skel
        useradd -R $ROOTFS -m -s /bin/bash dizzyo 2>/dev/null || true
        echo "dizzyo:dizzyo" | chpasswd -R $ROOTFS 2>/dev/null || true

        mkdir -p $ROOTFS/etc/NetworkManager/conf.d
        printf '[main]\ndns=default\n' > $ROOTFS/etc/NetworkManager/conf.d/dns.conf

        echo "Rootfs configured"

    - name: Install DizzyoOS installer
      run: |
        set -e
        ROOTFS=/tmp/rootfs
        chmod +x $GITHUB_WORKSPACE/dizzyo-os/installer/scripts/dizzyo-install.sh
        sudo cp $GITHUB_WORKSPACE/dizzyo-os/installer/scripts/dizzyo-install.sh $ROOTFS/usr/local/bin/dizzyo-install.sh
        chmod +x $ROOTFS/usr/local/bin/dizzyo-install.sh

        sudo cp $GITHUB_WORKSPACE/dizzyo-os/installer/autostart/dizzyo-install.desktop $ROOTFS/usr/share/applications/dizzyo-install.desktop

        mkdir -p $ROOTFS/etc/skel/Desktop
        sudo cp $GITHUB_WORKSPACE/dizzyo-os/installer/autostart/dizzyo-install.desktop $ROOTFS/etc/skel/Desktop/dizzyo-install.desktop
        chmod +x $ROOTFS/etc/skel/Desktop/dizzyo-install.desktop

        mkdir -p $ROOTFS/etc/skel/.config/autostart
        sudo cp $GITHUB_WORKSPACE/dizzyo-os/installer/autostart/dizzyo-install.desktop $ROOTFS/etc/skel/.config/autostart/dizzyo-install.desktop

        mkdir -p $ROOTFS/home/dizzyo/Desktop
        sudo cp $GITHUB_WORKSPACE/dizzyo-os/installer/autostart/dizzyo-install.desktop $ROOTFS/home/dizzyo/Desktop/dizzyo-install.desktop
        chmod +x $ROOTFS/home/dizzyo/Desktop/dizzyo-install.desktop

        mkdir -p $ROOTFS/home/dizzyo/.config/autostart
        sudo cp $GITHUB_WORKSPACE/dizzyo-os/installer/autostart/dizzyo-install.desktop $ROOTFS/home/dizzyo/.config/autostart/dizzyo-install.desktop
        chown -R 1000:1000 $ROOTFS/home/dizzyo/

        echo "Installer installed"

    - name: Create initramfs and build ISO
      run: |
        set -e
        ROOTFS=/tmp/rootfs

        echo "=== Creating initramfs ==="
        arch-chroot $ROOTFS mkinitcpio -P 2>/dev/null || echo "mkinitcpio fallback"

        echo "=== Creating squashfs ==="
        mksquashfs $ROOTFS /tmp/rootfs.squashfs -comp zstd -Xcompression-level 19 -noappend
        echo "Squashfs: $(ls -lh /tmp/rootfs.squashfs | awk '{print $5}')"

        ISO_DIR=/tmp/iso
        rm -rf $ISO_DIR
        mkdir -p $ISO_DIR/{arch/{boot/x86_64,x86_64},boot/grub,EFI/BOOT,isolinux}

        cp /tmp/rootfs.squashfs $ISO_DIR/arch/x86_64/rootfs.squashfs
        cp $ROOTFS/boot/vmlinuz-linux $ISO_DIR/arch/boot/x86_64/vmlinuz-linux
        cp $ROOTFS/boot/initramfs-linux.img $ISO_DIR/arch/boot/x86_64/initramfs-linux

        echo "Kernel: $(ls -lh $ISO_DIR/arch/boot/x86_64/vmlinuz-linux)"
        echo "Initrd: $(ls -lh $ISO_DIR/arch/boot/x86_64/initramfs-linux)"

        sudo bash -c "printf 'set default=0\nset timeout=5\nset gfxmode=auto\n\nmenuentry \"DizzyoOS 1.0.0 (Genesis)\" {\n    linux /arch/boot/x86_64/vmlinuz-linux archisolabel=DIZZYO_OS\n    initrd /arch/boot/x86_64/initramfs-linux\n}\n\nmenuentry \"DizzyoOS 1.0.0 Fallback\" {\n    linux /arch/boot/x86_64/vmlinuz-linux archisolabel=DIZZYO_OS nomodeset\n    initrd /arch/boot/x86_64/initramfs-linux\n}\n' > $ISO_DIR/boot/grub/grub.cfg"

        grub-mkstandalone --format=x86_64-efi --output=$ISO_DIR/EFI/BOOT/BOOTX64.EFI --modules="linux normal iso9660 part_gpt" --locales="" --fonts="" "boot/grub/grub.cfg=$ISO_DIR/boot/grub/grub.cfg"

        sudo bash -c "printf 'UI vesamenu.c32\nPROMPT 0\nTIMEOUT 50\nDEFAULT dizzyo\n\nLABEL dizzyo\n    MENU LABEL DizzyoOS 1.0.0 (Genesis)\n    LINUX /arch/boot/x86_64/vmlinuz-linux\n    INITRD /arch/boot/x86_64/initramfs-linux\n    APPEND archisolabel=DIZZYO_OS\n\nLABEL dizzyo-fallback\n    MENU LABEL DizzyoOS 1.0.0 Fallback (nomodeset)\n    LINUX /arch/boot/x86_64/vmlinuz-linux\n    INITRD /arch/boot/x86_64/initramfs-linux\n    APPEND archisolabel=DIZZYO_OS nomodeset\n' > $ISO_DIR/isolinux/isolinux.cfg"

        cp /usr/lib/syslinux/bios/isolinux.bin $ISO_DIR/isolinux/
        cp /usr/lib/syslinux/bios/vesamenu.c32 $ISO_DIR/isolinux/
        cp /usr/lib/syslinux/bios/ldlinux.c32 $ISO_DIR/isolinux/
        cp /usr/lib/syslinux/bios/libcom32.c32 $ISO_DIR/isolinux/
        cp /usr/lib/syslinux/bios/libutil.c32 $ISO_DIR/isolinux/
        echo "Isolinux: $(ls -la $ISO_DIR/isolinux/)"

        MBR_BIN=/usr/lib/syslinux/bios/isohdpfx.bin
        xorriso -as mkisofs -iso-level 3 -full-iso9660-filenames -volid "DIZZYO_OS" -output /tmp/dizzyo-os-1.0.0-x86_64.iso -isohybrid-mbr "$MBR_BIN" -eltorito-boot isolinux/isolinux.bin -no-emul-boot -boot-load-size 4 -boot-info-table -eltorito-alt-boot -e EFI/BOOT/BOOTX64.EFI -no-emul-boot -isohybrid-gpt-basdat $ISO_DIR/

        echo "=== BUILD COMPLETE ==="
        mkdir -p $GITHUB_WORKSPACE/output
        cp /tmp/dizzyo-os-1.0.0-x86_64.iso $GITHUB_WORKSPACE/output/
        ls -lh $GITHUB_WORKSPACE/output/

    - name: Upload ISO
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: dizzyo-os-iso
        path: output/*.iso
        retention-days: 30
