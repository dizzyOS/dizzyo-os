name: Build DizzyoOS ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    container:
      image: archlinux:latest
      options: --user root

    steps:
    - name: Setup Arch Linux
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm \
          base-devel git squashfs-tools xorriso grub \
          mtools dosfstools cpio gzip wget \
          --noconfirm

    - name: Checkout
      uses: actions/checkout@v4

    - name: Build DizzyoOS
      run: |
        set -e
        echo "=========================================="
        echo "    Building DizzyoOS on ARCH LINUX"
        echo "=========================================="
        
        ROOTFS=rootfs
        INITRD=initrd_dir
        OUTPUT=output
        
        # ===== 1. Create rootfs =====
        echo "=== Creating DizzyoOS rootfs ==="
        rm -rf ${ROOTFS}
        mkdir -p ${ROOTFS}/{bin,sbin,lib,lib64,etc,var,proc,sys,dev,tmp,run,root,boot,opt,mnt,srv,home}
        mkdir -p ${ROOTFS}/usr/{bin,sbin,lib,lib64,share}
        mkdir -p ${ROOTFS}/dev/{pts,shm}
        mkdir -p ${ROOTFS}/etc/pam.d
        
        # DizzyoOS branding
        cat > ${ROOTFS}/etc/os-release << 'EOF'
NAME="DizzyoOS"
VERSION="1.0.0"
ID=dizzyo
ID_LIKE=arch
PRETTY_NAME="DizzyoOS 1.0.0 (Genesis)"
HOME_URL="https://dizzyo-os.org"
BUG_REPORT_URL="https://github.com/dizzyOS/dizzyo-os/issues"
EOF
        
        echo "dizzyo-live" > ${ROOTFS}/etc/hostname
        cat > ${ROOTFS}/etc/hosts << 'EOF'
127.0.0.1   localhost
::1         localhost
127.0.1.1   dizzyo-live.localdomain   dizzyo-live
EOF
        echo "DizzyoOS 1.0.0 Live" > ${ROOTFS}/etc/issue
        chmod 1777 ${ROOTFS}/tmp
        
        # ===== 2. Create initramfs =====
        echo "=== Creating initramfs ==="
        rm -rf ${INITRD}
        mkdir -p ${INITRD}/{bin,sbin,etc,proc,sys,dev,tmp,run,usr/bin,usr/sbin}
        
        # Use busybox
        cp /usr/bin/busybox ${INITRD}/bin/ 2>/dev/null || \
        pacman -S --noconfirm busybox && cp /usr/bin/busybox ${INITRD}/bin/
        
        for cmd in sh mount umount echo ls cat mkdir sleep poweroff reboot switch_root modprobe insmod; do
          ln -sf busybox ${INITRD}/bin/${cmd} 2>/dev/null || true
        done
        ln -sf busybox ${INITRD}/sbin/mount 2>/dev/null || true
        ln -sf busybox ${INITRD}/sbin/umount 2>/dev/null || true
        ln -sf busybox ${INITRD}/sbin/switch_root 2>/dev/null || true
        
        # Copy kernel modules support
        cp /lib/modules/*/kernel/fs/squashfs/squashfs.ko ${INITRD}/lib/ 2>/dev/null || true
        cp /lib/modules/*/kernel/fs/isofs/isofs.ko ${INITRD}/lib/ 2>/dev/null || true
        cp /lib/modules/*/kernel/drivers/cdrom/cdrom.ko ${INITRD}/lib/ 2>/dev/null || true
        
        # Create init script
        cat > ${INITRD}/init << 'INITEOF'
#!/bin/sh
export PATH=/bin:/sbin:/usr/bin:/usr/sbin

echo ""
echo "=========================================="
echo "    DizzyoOS 1.0.0 (Genesis)"
echo "=========================================="
echo ""

# Load modules
for mod in squashfs isofs cdrom; do
  insmod /lib/${mod}.ko 2>/dev/null
done

mount -t proc proc /proc
mount -t sysfs sysfs /sys
mount -t devtmpfs devtmpfs /dev
mount -t tmpfs tmpfs /run
mount -t tmpfs tmpfs /tmp
mkdir -p /dev/pts
mount -t devpts devpts /dev/pts

echo "Kernel: $(uname -r)"
echo ""
echo "Searching for DizzyoOS installation..."
echo ""

FOUND=0
for dev in /dev/sr0 /dev/sr1 /dev/cdrom; do
  if [ -b "$dev" ]; then
    mkdir -p /mnt/live
    mount -t iso9660 -o ro "$dev" /mnt/live 2>/dev/null && {
      echo "Found live media on $dev"
      if [ -f /mnt/live/arch/x86_64/rootfs.squashfs ]; then
        echo "Mounting DizzyoOS rootfs..."
        mkdir -p /mnt/newroot
        mount -t squashfs -o ro,loop /mnt/live/arch/x86_64/rootfs.squashfs /mnt/newroot
        FOUND=1
        break
      fi
    }
  fi
done

if [ "$FOUND" = "1" ]; then
  echo "DizzyoOS found! Booting..."
  for d in dev proc sys run tmp; do
    mount --move /mnt/newroot/$d /$d 2>/dev/null
  done
  exec switch_root /mnt/newroot /sbin/init 2>/dev/null
fi

echo "No DizzyoOS media found. Dropping to shell..."
echo ""
exec /bin/sh
INITEOF
        chmod +x ${INITRD}/init
        
        # Pack initramfs
        cd ${INITRD}
        find . -print0 | cpio --null -o --format=newc 2>/dev/null | gzip -9 > ../initrd.img
        cd ..
        ls -lh initrd.img
        
        # ===== 3. Create squashfs =====
        echo "=== Creating squashfs ==="
        mksquashfs ${ROOTFS} rootfs.squashfs -comp zstd -Xcompression-level 19 -noappend
        ls -lh rootfs.squashfs
        
        # ===== 4. Build ISO =====
        echo "=== Building DizzyoOS ISO ==="
        mkdir -p ${OUTPUT}
        rm -rf iso_root
        mkdir -p iso_root/{arch/{boot/x86_64,x86_64},boot/grub,EFI/BOOT}
        
        cp rootfs.squashfs iso_root/arch/x86_64/rootfs.squashfs
        cp initrd.img iso_root/arch/boot/x86_64/initramfs-linux
        
        # Download kernel
        echo "Downloading Arch Linux kernel..."
        wget -q "https://archlinux.org/packages/core/x86_64/linux/download" -O /tmp/linux.pkg.tar.zst
        tar --zstd -xf /tmp/linux.pkg.tar.zst -C iso_root/arch/boot/x86_64/ boot/vmlinuz-linux 2>/dev/null || \
        cp /boot/vmlinuz-linux iso_root/arch/boot/x86_64/vmlinuz-linux 2>/dev/null || \
        echo "Using host kernel"
        
        ls -la iso_root/arch/boot/x86_64/
        
        # GRUB config
        cat > iso_root/boot/grub/grub.cfg << 'GRUBCFG'
set default=0
set timeout=5
set gfxmode=auto

menuentry "DizzyoOS 1.0.0 (Genesis)" {
    linux /arch/boot/x86_64/vmlinuz-linux archisolabel=DIZZYO_OS
    initrd /arch/boot/x86_64/initramfs-linux
}

menuentry "DizzyoOS 1.0.0 - Fallback (nomodeset)" {
    linux /arch/boot/x86_64/vmlinuz-linux archisolabel=DIZZYO_OS nomodeset
    initrd /arch/boot/x86_64/initramfs-linux
}
GRUBCFG
        
        # GRUB EFI
        grub-mkstandalone \
          --format=x86_64-efi \
          --output=iso_root/EFI/BOOT/BOOTX64.EFI \
          --modules="linux normal iso9660 part_gpt" \
          --locales="" --fonts="" \
          "boot/grub/grub.cfg=iso_root/boot/grub/grub.cfg"
        
        # GRUB BIOS
        grub-mkstandalone \
          --format=i386-pc \
          --output=iso_root/boot/grub/bios.img \
          --modules="linux normal iso9660 biosdisk search" \
          --locales="" --fonts="" \
          "boot/grub/grub.cfg=iso_root/boot/grub/grub.cfg"
        
        # Combine BIOS boot images
        cat /usr/lib/grub/i386-pc/cdboot.img iso_root/boot/grub/bios.img > iso_root/boot/grub/bios-combined.img
        
        # Create ISO
        xorriso -as mkisofs \
          -iso-level 3 \
          -full-iso9660-filenames \
          -volid "DIZZYO_OS" \
          -output ${OUTPUT}/dizzyo-os-1.0.0-x86_64.iso \
          -eltorito-boot boot/grub/bios-combined.img \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
          -eltorito-alt-boot \
            -e EFI/BOOT/BOOTX64.EFI \
            -no-emul-boot -isohybrid-gpt-basdat \
          iso_root/
        
        echo ""
        echo "=========================================="
        echo "    BUILD COMPLETE ON ARCH LINUX!"
        echo "=========================================="
        ls -lh ${OUTPUT}/

    - name: Upload ISO
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dizzyo-os-iso
        path: output/*.iso
        retention-days: 30
