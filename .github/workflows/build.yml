name: Build DizzyoOS ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools cpio genisoimage isolinux syslinux-common linux-image-generic

    - name: Build ISO
      run: |
        set -e
        cd "$GITHUB_WORKSPACE"
        echo "Working dir: $(pwd)"

        ROOTFS=/tmp/rootfs
        OUTPUT=$GITHUB_WORKSPACE/output
        KERNEL=$(ls /boot/vmlinuz-* | head -1)
        INITRD_SRC=$(ls /boot/initrd.img-* | head -1)

        echo "Using kernel: $KERNEL"
        echo "Using initrd: $INITRD_SRC"

        mkdir -p $OUTPUT
        rm -rf $ROOTFS

        echo "=== Creating rootfs ==="
        mkdir -p $ROOTFS/{bin,sbin,lib,lib64,etc,var,proc,sys,dev,tmp,run,root,boot,opt,mnt,srv,home}
        mkdir -p $ROOTFS/usr/{bin,sbin,lib,lib64,share}
        mkdir -p $ROOTFS/dev/{pts,shm}
        echo 'NAME="DizzyoOS"' | sudo tee $ROOTFS/etc/os-release
        echo 'VERSION="1.0.0"' | sudo tee -a $ROOTFS/etc/os-release
        echo 'ID=dizzyo' | sudo tee -a $ROOTFS/etc/os-release
        echo 'ID_LIKE=arch' | sudo tee -a $ROOTFS/etc/os-release
        echo 'PRETTY_NAME="DizzyoOS 1.0.0 (Genesis)"' | sudo tee -a $ROOTFS/etc/os-release
        echo 'HOME_URL="https://dizzyo-os.org"' | sudo tee -a $ROOTFS/etc/os-release
        echo "dizzyo-live" | sudo tee $ROOTFS/etc/hostname
        echo "127.0.0.1 localhost" | sudo tee $ROOTFS/etc/hosts
        echo "::1 localhost" | sudo tee -a $ROOTFS/etc/hosts
        echo "127.0.1.1 dizzyo-live dizzyo-live.localdomain" | sudo tee -a $ROOTFS/etc/hosts
        sudo chmod 1777 $ROOTFS/tmp
        echo "Rootfs done"

        echo "=== Creating squashfs ==="
        sudo mksquashfs $ROOTFS /tmp/rootfs.squashfs -comp zstd -Xcompression-level 19 -noappend
        echo "Squashfs done"

        echo "=== Building ISO ==="
        ISO_DIR=/tmp/iso
        rm -rf $ISO_DIR
        mkdir -p $ISO_DIR/{arch/{boot/x86_64,x86_64},boot/grub,EFI/BOOT,isolinux}

        sudo cp /tmp/rootfs.squashfs $ISO_DIR/arch/x86_64/rootfs.squashfs
        sudo cp $KERNEL $ISO_DIR/arch/boot/x86_64/vmlinuz-linux
        sudo cp $INITRD_SRC $ISO_DIR/arch/boot/x86_64/initramfs-linux

        sudo bash -c "printf 'set default=0\nset timeout=5\nset gfxmode=auto\n\nmenuentry \"DizzyoOS 1.0.0 (Genesis)\" {\n    linux /arch/boot/x86_64/vmlinuz-linux archisolabel=DIZZYO_OS\n    initrd /arch/boot/x86_64/initramfs-linux\n}\n\nmenuentry \"DizzyoOS 1.0.0 Fallback\" {\n    linux /arch/boot/x86_64/vmlinuz-linux archisolabel=DIZZYO_OS nomodeset\n    initrd /arch/boot/x86_64/initramfs-linux\n}\n' > $ISO_DIR/boot/grub/grub.cfg"

        sudo grub-mkstandalone --format=x86_64-efi --output=$ISO_DIR/EFI/BOOT/BOOTX64.EFI --modules="linux normal iso9660 part_gpt" --locales="" --fonts="" "boot/grub/grub.cfg=$ISO_DIR/boot/grub/grub.cfg"

        sudo grub-mkstandalone --format=i386-pc --output=$ISO_DIR/boot/grub/bios.img --modules="linux normal iso9660 biosdisk search" --locales="" --fonts="" "boot/grub/grub.cfg=$ISO_DIR/boot/grub/grub.cfg"

        sudo cat /usr/lib/grub/i386-pc/cdboot.img $ISO_DIR/boot/grub/bios.img | sudo tee $ISO_DIR/boot/grub/bios-combined.img > /dev/null

        sudo xorriso -as mkisofs -iso-level 3 -full-iso9660-filenames -volid "DIZZYO_OS" -output $OUTPUT/dizzyo-os-1.0.0-x86_64.iso -eltorito-boot boot/grub/bios-combined.img -no-emul-boot -boot-load-size 4 -boot-info-table -eltorito-alt-boot -e EFI/BOOT/BOOTX64.EFI -no-emul-boot -isohybrid-gpt-basdat $ISO_DIR/

        echo "=== BUILD COMPLETE ==="
        ls -lh $OUTPUT/

    - name: Upload ISO
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: dizzyo-os-iso
        path: output/*.iso
        retention-days: 30
