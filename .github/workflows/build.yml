name: Build DizzyoOS ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    
    steps:
    - name: Install git
      run: pacman -Syu --noconfirm && pacman -S --noconfirm git
      
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        pacman -S --noconfirm archiso squashfs-tools
    
    - name: Make scripts executable
      run: chmod +x build-simple.sh create-iso.sh
    
    - name: Build ISO
      run: ./build-simple.sh
    
    - name: Upload ISO
      uses: actions/upload-artifact@v4
      with:
        name: dizzyo-os-iso
        path: output/*.iso
        retention-days: 30
