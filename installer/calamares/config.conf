# DizzyoOS Calamares Installer Configuration

# General settings
module: welcome
config:
  # Welcome page
  title: "Welcome to DizzyoOS"
  message: "DizzyoOS is a performance-first Linux distribution with the best Windows emulation support."
  
  # Release info
  release:
    version: "1.0.0"
    codename: "Genesis"
    
  # Branding
  branding:
    sidebar:
      image: "dizzyo-logo"
      show: true
    product:
      name: "DizzyoOS"
      version: "1.0.0"
      
# Desktop selection
module: desktop
config:
  # Available desktop environments
  desktops:
    - id: plasma
      name: "KDE Plasma 6"
      description: "Full-featured desktop environment"
      packages:
        - plasma-desktop
        - plasma-workspace
        - kde-applications-meta
        - sddm
        - wayland
      
    - id: gnome
      name: "GNOME 47"
      description: "Modern, clean desktop"
      packages:
        - gnome
        - gnome-extra
        - gdm
      
    - id: cosmic
      name: "COSMIC"
      description: "System76's Rust-based desktop"
      packages:
        - cosmic
        - cosmic-greeter
      
    - id: xfce
      name: "XFCE 4"
      description: "Lightweight, stable desktop"
      packages:
        - xfce4
        - xfce4-goodies
        - lightdm
      
    - id: cinnamon
      name: "Cinnamon"
      description: "Traditional desktop experience"
      packages:
        - cinnamon
        - cinnamon-nemo
        - lightdm
      
    - id: mate
      name: "MATE"
      description: "GNOME 2 fork"
      packages:
        - mate
        - mate-extra
        - lightdm
      
    - id: budgie
      name: "Budgie"
      description: "Modern, elegant desktop"
      packages:
        - budgie-desktop
        - budgie-control-center
        - budgie-screensaver
        - lightdm
      
    - id: lxqt
      name: "LXQt"
      description: "Ultra-lightweight desktop"
      packages:
        - lxqt
        - sddm
      
    - id: hyprland
      name: "Hyprland"
      description: "Dynamic tiling Wayland compositor"
      packages:
        - hyprland
        - hyprpaper
        - hyprlock
        - hypridle
        - waybar
        - wofi
        - mako
      
    - id: sway
      name: "Sway"
      description: "i3-compatible Wayland compositor"
      packages:
        - sway
        - swaybg
        - waybar
        - wofi
        - mako
      
    - id: niri
      name: "niri"
      description: "Scrollable tiling Wayland compositor"
      packages:
        - niri
        - waybar
        - wofi
        - mako
      
    - id: river
      name: "river"
      description: "Dynamic tiling Wayland compositor"
      packages:
        - river
        - waybar
        - wofi
        - mako
      
    - id: i3
      name: "i3"
      description: "Manual tiling window manager"
      packages:
        - i3
        - i3lock
        - i3status
        - dmenu
        - rofi
      
    - id: dwm
      name: "dwm"
      description: "Dynamic tiling window manager"
      packages:
        - dwm
        - dmenu
        - st
      
    - id: xmonad
      name: "xmonad"
      description: "Haskell-based tiling WM"
      packages:
        - xmonad
        - xmonad-contrib
        - dmenu
      
    - id: bspwm
      name: "bspwm"
      description: "Binary space partitioning WM"
      packages:
        - bspwm
        - sxhkd
        - dmenu
        - rofi
      
    - id: awesome
      name: "awesome"
      description: "Configurable tiling WM"
      packages:
        - awesome
        - rofi
      
    - id: orbitiny
      name: "Orbitiny"
      description: "Qt-based desktop with 52 components"
      packages:
        - orbitiny-desktop
      
    - id: edex-de
      name: "eDEX-DE"
      description: "Sci-fi desktop environment"
      packages:
        - edex-de
      
    - id: fluxland
      name: "fluxland"
      description: "Wayland Fluxbox"
      packages:
        - fluxland
        - waybar
        - wofi
      
    - id: margo
      name: "margo"
      description: "Rust-based tiling compositor"
      packages:
        - margo
        - mshell
      
    - id: fenriz
      name: "fenriz"
      description: "Minimalist tiling compositor"
      packages:
        - fenriz
        - waybar
        - wofi
      
    - id: carrot
      name: "carrot"
      description: "Pure Rust tiling compositor"
      packages:
        - carrot
        - waybar
        - wofi
      
    - id: stilch
      name: "stilch"
      description: "Tiling compositor with virtual outputs"
      packages:
        - stilch
        - waybar
        - wofi
      
    - id: ashwc
      name: "ashwc"
      description: "Master layout tiling compositor"
      packages:
        - ashwc
        - waybar
        - wofi
      
    - id: nuroneko
      name: "Nuroneko"
      description: "Modular Hyprland environment"
      packages:
        - nuroneko
      
    - id: nidara
      name: "Nidara"
      description: "AI-native Hyprland DE"
      packages:
        - nidara
      
    - id: tuiui
      name: "tuiui"
      description: "Terminal-based desktop"
      packages:
        - tuiui
      
    - id: zde
      name: "zde"
      description: "Niri-based, zinc sandboxed"
      packages:
        - zde

# Init system selection
module: init
config:
  systems:
    - id: dinit
      name: "dinit"
      description: "Modern, fast service manager (Recommended)"
      packages:
        - dinit
        - dinit-utils
      
    - id: openrc
      name: "OpenRC"
      description: "Alternative init system"
      packages:
        - openrc
        - s6
      
    - id: runit
      name: "runit"
      description: "Simple and fast init"
      packages:
        - runit
      
    - id: systemd
      name: "systemd"
      description: "Full compatibility (optional)"
      packages:
        - systemd
        - systemd-sysv

# Filesystem selection
module: filesystem
config:
  filesystems:
    - id: btrfs
      name: "Btrfs"
      description: "Copy-on-write filesystem with snapshots (Recommended)"
      options:
        - compress=zstd:3
        - space_cache=v2
        - discard=async
        - ssd
      
    - id: ext4
      name: "ext4"
      description: "Traditional Linux filesystem"
      
    - id: xfs
      name: "XFS"
      description: "High-performance filesystem"

# Bootloader selection
module: bootloader
config:
  bootloaders:
    - id: limine
      name: "Limine"
      description: "Modern bootloader (Recommended)"
      
    - id: systemd-boot
      name: "systemd-boot"
      description: "Simple UEFI bootloader"
      
    - id: grub
      name: "GRUB"
      description: "Traditional bootloader"

# Gaming meta
module: gaming
config:
  description: "Install gaming packages and optimizations"
  packages:
    - steam
    - lutris
    - wine
    - wine-gecko
    - wine-mono
    - proton-ge-custom
    - mangohud
    - gamemode
    - gamescope
    - dxvk
    - vkd3d-proton
    - lib32-dxvk
    - lib32-vkd3d-proton
    - lib32-vulkan-icd-loader
    - lib32-mesa
    - lib32-nvidia-utils
    - lib32-libpulse
    - lib32-alsa-plugins
    - lib32-gtk3

# Security settings
module: security
config:
  options:
    - id: apparmor
      name: "AppArmor"
      description: "Mandatory access control"
      default: true
      
    - id: firejail
      name: "Firejail"
      description: "Application sandboxing"
      default: true
      
    - id: clamav
      name: "ClamAV"
      description: "Antivirus scanning"
      default: false
      
    - id: rkhunter
      name: "rkhunter"
      description: "Rootkit detection"
      default: false

# Post-installation
module: postinstall
config:
  scripts:
    - name: "Configure dinit services"
      command: "dizzyo-postinstall dinit"
      
    - name: "Configure gaming"
      command: "dizzyo-postinstall gaming"
      
    - name: "Configure security"
      command: "dizzyo-postinstall security"
      
    - name: "Configure performance"
      command: "dizzyo-postinstall performance"
      
    - name: "Install DizzyoOS tools"
      command: "dizzyo-postinstall tools"
